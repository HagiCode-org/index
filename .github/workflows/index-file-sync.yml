name: Index File Sync

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

# Source-side mirrors only; Astro publishes the stable public routes from these files.
concurrency:
  group: index-file-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-managed-indexes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify install and lockfile stability
        run: |
          test -d node_modules
          git diff --exit-code -- pnpm-lock.yaml

      - name: Registry neutrality
        run: pnpm run check:registry

      - name: Sync managed package indexes
        run: node ./scripts/sync-r2-index.mjs

      - name: Validate catalog
        run: pnpm run validate

      - name: Check managed file diff
        id: diff
        run: node ./scripts/check-managed-index-diff.mjs >> "$GITHUB_OUTPUT"

      - name: Commit managed mirror updates
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/public/index-catalog.json src/data/public/server/index.json src/data/public/desktop/index.json
          git commit -m "chore(index): sync managed package indexes"
          git push

      - name: Trigger gh-pages deployment workflow
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run index-deploy-gh-pages.yml --ref "${GITHUB_REF_NAME}"
