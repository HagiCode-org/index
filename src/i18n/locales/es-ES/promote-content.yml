promotions:
  desktop-microsoft-store-2026-06-10:
    title: "HagiCode para Windows ya está en Microsoft Store"
    description: "HagiCode para Windows ya está disponible oficialmente en Microsoft Store. Los usuarios de Windows pueden instalarlo directamente desde la tienda y permanecer en el canal de actualizaciones gestionado por la tienda. Abre la ficha y échale un vistazo."
    cta: "Abrir Microsoft Store"
    alt: "HagiCode for Windows Microsoft Store artwork"
  main-game-2026-04-29:
    title: "Por favor, añádela a tu lista de deseados"
    description: "Hagicode, el software de Vibe Coding no único en el mundo pero super práctico, sale el 29 de abril. Por favor, añádelo a tu lista de deseados de Steam. Sollozo. Por favor, por favor."
    cta: "Añadir a deseados en Steam"
    alt: "HagiCode Steam store capsule artwork"
  main-game-steam-ea-2026-04-29:
    title: "El Acceso Anticipado ya está aquí"
    description: "Hagicode, el software de Vibe Coding no único en el mundo pero super práctico, ya está en Acceso Anticipado en Steam. Ven a echarle un vistazo. Sollozo. Por favor, por favor."
    cta: "Ver Acceso Anticipado"
    alt: "HagiCode Early Access Steam artwork"
  hagicode-plus-bundle:
    title: "Pack Hagicode Plus"
    description: "Hagicode Plus, la opción no única en el mundo pero realmente bien empaquetada, tiene un 15 % de descuento con el juego base y el DLC Turbo Engine. Ven a verlo en Steam. Sollozo. Por favor, por favor."
    cta: "Ver el pack"
    alt: "HagiCode Plus Steam bundle artwork"
  hagicode-turbo-engine-dlc:
    title: "DLC Turbo Engine"
    description: "El DLC Turbo Engine no es único en el mundo, pero de verdad funciona: desbloquea hasta 32 sesiones en línea simultáneas y más opciones de personalización para tu flujo de trabajo con Hagicode. Ven a echarle un vistazo en Steam. Sollozo. Por favor, por favor."
    cta: "Ver el DLC"
    alt: "Turbo Engine DLC Steam artwork"
  subsite-awesome:
    title: "Awesome Site: colecciones de código abierto seleccionadas"
    description: "Encuentra tu próxima herramienta, idea o inspiración en colecciones de código abierto seleccionadas por la comunidad. Elige un tema, lee en tu idioma y sigue el enlace hasta la fuente original."
    cta: "Explorar Awesome Site"
    alt: "Awesome Site banner: community-curated open-source collections"
  subsite-design:
    title: "Awesome Design: una galería de DESIGN.md"
    description: "Explora sistemas de diseño seleccionados con vistas previas en directo y referencias del README; después copia un DESIGN.md en tu proyecto y deja que tu agente de IA cree una página que encaje."
    cta: "Explorar la galería de diseño"
    alt: "Awesome Design banner: a gallery of DESIGN.md design systems"
  subsite-openspec:
    title: "OpenSpec: acuerda el plan antes de que tu IA escriba código"
    description: "OpenSpec es una capa ligera de especificaciones para programar con IA. Describe un cambio, revisa la propuesta, las especificaciones, el diseño y las tareas que redacta tu IA, después impleméntalo y archívalo en especificaciones vivas. Sin fases rígidas, y encaja con bases de código existentes y con los asistentes de IA que ya usas."
    cta: "Descubrir OpenSpec"
    alt: "OpenSpec banner: agree on the spec, then build with AI"
  subsite-omniroute:
    title: "OmniRoute Docs: un solo endpoint para muchos proveedores de IA"
    description: "Descubre cómo OmniRoute enruta muchos proveedores y modelos de IA a través de un único endpoint, con compatibilidad con planes gratuitos y respaldo automático para que tus herramientas de programación sigan funcionando."
    cta: "Leer la documentación de OmniRoute"
    alt: "OmniRoute Docs banner: one endpoint for many AI providers"
