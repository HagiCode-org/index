promotions:
  desktop-microsoft-store-2026-06-10:
    title: "HagiCode за Windows вече е в Microsoft Store"
    description: "HagiCode за Windows е официално наличен в Microsoft Store. Потребителите на Windows могат да го инсталират директно от магазина и да останат в управлявания от магазина път за обновяване. Отворете страницата и погледнете."
    cta: "Отвори Microsoft Store"
    alt: "HagiCode for Windows Microsoft Store artwork"
  subsite-awesome:
    title: "Awesome Site: подбрани колекции с отворен код"
    description: "Намерете следващия си инструмент, идея или вдъхновение в колекции с отворен код, подбрани от общността. Изберете тема, четете на своя език и последвайте връзката към оригиналния източник."
    cta: "Разгледайте Awesome Site"
    alt: "Awesome Site banner: community-curated open-source collections"
  subsite-design:
    title: "Awesome Design: галерия с DESIGN.md"
    description: "Разглеждайте подбрани дизайн системи чрез визуализации на живо и препратки към README, после копирайте DESIGN.md в проекта си и оставете своя AI агент да изгради съответстваща страница."
    cta: "Разгледайте галерията с дизайни"
    alt: "Awesome Design banner: a gallery of DESIGN.md design systems"
  subsite-openspec:
    title: "OpenSpec: съгласувайте плана, преди AI да напише код"
    description: "OpenSpec е лек слой от спецификации за програмиране с AI. Опишете промяна, прегледайте предложението, спецификациите, дизайна и задачите, които AI изготвя, после я изградете и я архивирайте в актуални спецификации. Без твърди фази, пасва на съществуващи кодови бази и на AI асистентите, които вече използвате."
    cta: "Разгледайте OpenSpec"
    alt: "OpenSpec banner: agree on the spec, then build with AI"
  subsite-omniroute:
    title: "OmniRoute Docs: една крайна точка за много AI доставчици"
    description: "Научете как OmniRoute маршрутизира много AI доставчици и модели през една крайна точка, с поддръжка на безплатни планове и автоматично превключване, така че инструментите ви за програмиране да продължават да работят."
    cta: "Прочетете документацията на OmniRoute"
    alt: "OmniRoute Docs banner: one endpoint for many AI providers"
