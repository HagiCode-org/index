promotions:
  desktop-microsoft-store-2026-06-10:
    title: "Το HagiCode για Windows είναι τώρα στο Microsoft Store"
    description: "Το HagiCode για Windows είναι επίσημα διαθέσιμο στο Microsoft Store. Οι χρήστες Windows μπορούν να το εγκαταστήσουν απευθείας από το κατάστημα και να παραμείνουν στη διαδρομή ενημερώσεων που διαχειρίζεται το κατάστημα. Ανοίξτε τη σελίδα και ρίξτε μια ματιά."
    cta: "Άνοιγμα Microsoft Store"
    alt: "HagiCode for Windows Microsoft Store artwork"
  subsite-awesome:
    title: "Awesome Site: επιμελημένες συλλογές ανοιχτού κώδικα"
    description: "Βρείτε το επόμενο εργαλείο, ιδέα ή έμπνευσή σας σε συλλογές ανοιχτού κώδικα που επιμελείται η κοινότητα. Επιλέξτε ένα θέμα, διαβάστε στη γλώσσα σας και ακολουθήστε τον σύνδεσμο προς την αρχική πηγή."
    cta: "Εξερευνήστε το Awesome Site"
    alt: "Awesome Site banner: community-curated open-source collections"
  subsite-design:
    title: "Awesome Design: μια γκαλερί DESIGN.md"
    description: "Περιηγηθείτε σε επιμελημένα συστήματα σχεδίασης μέσω ζωντανών προεπισκοπήσεων και αναφορών README, έπειτα αντιγράψτε ένα DESIGN.md στο έργο σας και αφήστε τον AI πράκτορά σας να δημιουργήσει μια αντίστοιχη σελίδα."
    cta: "Περιηγηθείτε στη γκαλερί σχεδίασης"
    alt: "Awesome Design banner: a gallery of DESIGN.md design systems"
  subsite-openspec:
    title: "OpenSpec: συμφωνήστε στο σχέδιο πριν γράψει κώδικα το AI"
    description: "Το OpenSpec είναι ένα ελαφρύ επίπεδο προδιαγραφών για προγραμματισμό με AI. Περιγράψτε μια αλλαγή, εξετάστε την πρόταση, τις προδιαγραφές, τον σχεδιασμό και τις εργασίες που συντάσσει το AI σας, έπειτα υλοποιήστε την και αρχειοθετήστε την σε ζωντανές προδιαγραφές. Χωρίς άκαμπτες φάσεις, και ταιριάζει σε υπάρχουσες βάσεις κώδικα και στους βοηθούς AI που ήδη χρησιμοποιείτε."
    cta: "Ανακαλύψτε το OpenSpec"
    alt: "OpenSpec banner: agree on the spec, then build with AI"
  subsite-omniroute:
    title: "OmniRoute Docs: ένα σημείο πρόσβασης για πολλούς παρόχους AI"
    description: "Μάθετε πώς το OmniRoute δρομολογεί πολλούς παρόχους και μοντέλα AI μέσω ενός ενιαίου σημείου πρόσβασης, με υποστήριξη δωρεάν επιπέδων και αυτόματη εναλλακτική δρομολόγηση, ώστε τα εργαλεία προγραμματισμού σας να συνεχίζουν να λειτουργούν."
    cta: "Διαβάστε την τεκμηρίωση του OmniRoute"
    alt: "OmniRoute Docs banner: one endpoint for many AI providers"
