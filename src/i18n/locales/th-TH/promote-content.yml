promotions:
  desktop-microsoft-store-2026-06-10:
    title: "HagiCode สำหรับ Windows พร้อมแล้วใน Microsoft Store"
    description: "HagiCode สำหรับ Windows เปิดให้ใช้งานอย่างเป็นทางการใน Microsoft Store แล้ว ผู้ใช้ Windows สามารถติดตั้งได้โดยตรงจากร้านค้าและอยู่บนช่องทางอัปเดตที่ร้านค้าจัดการ เปิดหน้าร้านแล้วมาดูกัน"
    cta: "เปิด Microsoft Store"
    alt: "HagiCode for Windows Microsoft Store artwork"
  subsite-awesome:
    title: "Awesome Site: คอลเลกชันโอเพนซอร์สที่คัดสรรแล้ว"
    description: "ค้นหาเครื่องมือ ไอเดีย หรือแรงบันดาลใจชิ้นต่อไปของคุณในคอลเลกชันโอเพนซอร์สที่ชุมชนคัดสรร เลือกหัวข้อ อ่านเป็นภาษาของคุณ แล้วตามลิงก์กลับไปยังแหล่งที่มาดั้งเดิม"
    cta: "สำรวจ Awesome Site"
    alt: "Awesome Site banner: community-curated open-source collections"
  subsite-design:
    title: "Awesome Design: แกลเลอรี DESIGN.md"
    description: "เรียกดูระบบดีไซน์ที่คัดสรรผ่านตัวอย่างสดและเอกสารอ้างอิง README จากนั้นคัดลอก DESIGN.md ไปใส่ในโปรเจกต์ของคุณ แล้วให้เอเจนต์ AI สร้างหน้าที่เข้ากัน"
    cta: "เรียกดูแกลเลอรีดีไซน์"
    alt: "Awesome Design banner: a gallery of DESIGN.md design systems"
  subsite-openspec:
    title: "OpenSpec: ตกลงแผนให้ตรงกันก่อนที่ AI จะเขียนโค้ด"
    description: "OpenSpec คือเลเยอร์สเปกแบบเบาสำหรับการเขียนโค้ดด้วย AI อธิบายการเปลี่ยนแปลง ตรวจทานข้อเสนอ สเปก การออกแบบ และงานย่อยที่ AI ร่างให้ จากนั้นลงมือทำและเก็บถาวรเป็นสเปกที่มีชีวิต ไม่มีขั้นตอนตายตัว และใช้ได้กับโค้ดเบสเดิมรวมถึงผู้ช่วย AI ที่คุณใช้อยู่แล้ว"
    cta: "ทำความรู้จัก OpenSpec"
    alt: "OpenSpec banner: agree on the spec, then build with AI"
  subsite-omniroute:
    title: "OmniRoute Docs: เอนด์พอยต์เดียวสำหรับผู้ให้บริการ AI จำนวนมาก"
    description: "เรียนรู้ว่า OmniRoute ส่งต่อผู้ให้บริการและโมเดล AI จำนวนมากผ่านเอนด์พอยต์เดียวได้อย่างไร พร้อมรองรับแผนฟรีและการสำรองอัตโนมัติ เพื่อให้เครื่องมือเขียนโค้ดของคุณทำงานต่อได้"
    cta: "อ่านเอกสาร OmniRoute"
    alt: "OmniRoute Docs banner: one endpoint for many AI providers"
