promotions:
  desktop-microsoft-store-2026-06-10:
    title: "HagiCode cho Windows đã có trên Microsoft Store"
    description: "HagiCode cho Windows đã chính thức có mặt trên Microsoft Store. Người dùng Windows có thể cài đặt trực tiếp từ cửa hàng và duy trì lộ trình cập nhật do cửa hàng quản lý. Mở trang và xem thử nhé."
    cta: "Mở Microsoft Store"
    alt: "HagiCode for Windows Microsoft Store artwork"
  subsite-awesome:
    title: "Awesome Site: các bộ sưu tập mã nguồn mở được tuyển chọn"
    description: "Tìm công cụ, ý tưởng hoặc nguồn cảm hứng tiếp theo của bạn trong các bộ sưu tập mã nguồn mở do cộng đồng tuyển chọn. Chọn một chủ đề, đọc bằng ngôn ngữ của bạn và theo liên kết để quay lại nguồn gốc."
    cta: "Khám phá Awesome Site"
    alt: "Awesome Site banner: community-curated open-source collections"
  subsite-design:
    title: "Awesome Design: thư viện DESIGN.md"
    description: "Duyệt các hệ thống thiết kế được tuyển chọn qua bản xem trước trực tiếp và tài liệu tham khảo README, sau đó sao chép DESIGN.md vào dự án của bạn và để tác tử AI dựng một trang phù hợp."
    cta: "Duyệt thư viện thiết kế"
    alt: "Awesome Design banner: a gallery of DESIGN.md design systems"
  subsite-openspec:
    title: "OpenSpec: thống nhất kế hoạch trước khi AI viết mã"
    description: "OpenSpec là lớp đặc tả nhẹ cho lập trình cùng AI. Mô tả một thay đổi, xem lại đề xuất, đặc tả, thiết kế và tác vụ do AI soạn, sau đó triển khai và lưu trữ thành các đặc tả luôn cập nhật. Không có giai đoạn cứng nhắc, phù hợp với cơ sở mã sẵn có và các trợ lý AI bạn đang dùng."
    cta: "Tìm hiểu OpenSpec"
    alt: "OpenSpec banner: agree on the spec, then build with AI"
  subsite-omniroute:
    title: "OmniRoute Docs: một điểm cuối cho nhiều nhà cung cấp AI"
    description: "Tìm hiểu cách OmniRoute định tuyến nhiều nhà cung cấp và mô hình AI qua một điểm cuối duy nhất, với hỗ trợ gói miễn phí và dự phòng tự động để các công cụ lập trình của bạn luôn hoạt động."
    cta: "Đọc tài liệu OmniRoute"
    alt: "OmniRoute Docs banner: one endpoint for many AI providers"
