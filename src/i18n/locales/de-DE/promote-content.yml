promotions:
  desktop-microsoft-store-2026-06-10:
    title: "HagiCode für Windows ist jetzt im Microsoft Store"
    description: "HagiCode für Windows ist offiziell im Microsoft Store verfügbar. Windows-Nutzer können es direkt aus dem Store installieren und bleiben auf dem store-verwalteten Update-Pfad. Öffne den Eintrag und schau vorbei."
    cta: "Microsoft Store öffnen"
    alt: "HagiCode for Windows Microsoft Store artwork"
  main-game-2026-04-29:
    title: "Bitte auf die Wunschliste setzen"
    description: "Hagicode, die nicht global einzigartige, aber super praktische Vibe-Coding-Software, erscheint am 29. April. Bitte füge sie deiner Steam-Wunschliste hinzu. Schluchz. Bitte, bitte."
    cta: "Auf Steam wunschlisten"
    alt: "HagiCode Steam store capsule artwork"
  main-game-steam-ea-2026-04-29:
    title: "Early Access ist endlich da"
    description: "Hagicode, die nicht global einzigartige, aber super praktische Vibe-Coding-Software, ist jetzt im Steam Early Access. Schau doch mal vorbei. Schluchz. Bitte, bitte."
    cta: "Early Access ansehen"
    alt: "HagiCode Early Access Steam artwork"
  hagicode-plus-bundle:
    title: "Hagicode Plus Paket"
    description: "Hagicode Plus, die nicht global einzigartige, aber toll zusammengestellte Option, gibt es 15 % günstiger zusammen mit dem Basisspiel und dem Turbo Engine DLC. Schau auf Steam vorbei. Schluchz. Bitte, bitte."
    cta: "Paket ansehen"
    alt: "HagiCode Plus Steam bundle artwork"
  hagicode-turbo-engine-dlc:
    title: "Turbo Engine DLC"
    description: "Das Turbo Engine DLC ist nicht global einzigartig, aber es läuft wirklich: Schalte bis zu 32 gleichzeitige Online-Sitzungen und mehr Anpassungsoptionen für deinen Hagicode-Workflow frei. Schau auf Steam vorbei. Schluchz. Bitte, bitte."
    cta: "DLC ansehen"
    alt: "Turbo Engine DLC Steam artwork"
  subsite-awesome:
    title: "Awesome Site: kuratierte Open-Source-Sammlungen"
    description: "Finde dein nächstes Tool, deine nächste Idee oder Inspiration in von der Community kuratierten Open-Source-Sammlungen. Wähle ein Thema, lies in deiner Sprache und folge dem Link zurück zur ursprünglichen Quelle."
    cta: "Awesome Site entdecken"
    alt: "Awesome Site banner: community-curated open-source collections"
  subsite-design:
    title: "Awesome Design: eine DESIGN.md-Galerie"
    description: "Stöbere durch kuratierte Designsysteme mit Live-Vorschauen und README-Verweisen, kopiere dann eine DESIGN.md in dein Projekt und lass deinen KI-Agenten eine passende Seite bauen."
    cta: "Designgalerie durchstöbern"
    alt: "Awesome Design banner: a gallery of DESIGN.md design systems"
  subsite-openspec:
    title: "OpenSpec: Erst den Plan abstimmen, dann schreibt die KI Code"
    description: "OpenSpec ist eine schlanke Spezifikationsebene für KI-Coding. Beschreibe eine Änderung, prüfe Vorschlag, Spezifikationen, Design und Aufgaben, die deine KI entwirft, setze sie dann um und archiviere sie in lebendigen Spezifikationen. Keine starren Phasen, passend für bestehende Codebasen und die KI-Assistenten, die du schon nutzt."
    cta: "OpenSpec entdecken"
    alt: "OpenSpec banner: agree on the spec, then build with AI"
  subsite-omniroute:
    title: "OmniRoute Docs: ein Endpunkt für viele KI-Anbieter"
    description: "Erfahre, wie OmniRoute viele KI-Anbieter und Modelle über einen einzigen Endpunkt routet, mit Unterstützung für kostenlose Kontingente und automatischem Fallback, damit deine Coding-Tools weiterlaufen."
    cta: "OmniRoute-Dokumentation lesen"
    alt: "OmniRoute Docs banner: one endpoint for many AI providers"
