promotions:
  desktop-microsoft-store-2026-06-10:
    title: "HagiCode para Windows já está na Microsoft Store"
    description: "HagiCode para Windows está oficialmente disponível na Microsoft Store. Os usuários do Windows podem instalá-lo diretamente pela loja e permanecer no caminho de atualização gerenciado pela loja. Abra a página e dê uma olhada."
    cta: "Abrir Microsoft Store"
    alt: "HagiCode for Windows Microsoft Store artwork"
  subsite-awesome:
    title: "Awesome Site: coleções de código aberto selecionadas"
    description: "Encontre sua próxima ferramenta, ideia ou inspiração em coleções de código aberto selecionadas pela comunidade. Escolha um tema, leia no seu idioma e siga o link de volta à fonte original."
    cta: "Explorar o Awesome Site"
    alt: "Awesome Site banner: community-curated open-source collections"
  subsite-design:
    title: "Awesome Design: uma galeria de DESIGN.md"
    description: "Navegue por sistemas de design selecionados com prévias ao vivo e referências de README, depois copie um DESIGN.md para o seu projeto e deixe seu agente de IA criar uma página que combine."
    cta: "Navegar pela galeria de design"
    alt: "Awesome Design banner: a gallery of DESIGN.md design systems"
  subsite-openspec:
    title: "OpenSpec: alinhe o plano antes que a IA escreva código"
    description: "OpenSpec é uma camada leve de especificações para programar com IA. Descreva uma mudança, revise a proposta, as especificações, o design e as tarefas que sua IA redige, depois construa e arquive tudo em especificações vivas. Sem fases rígidas, e funciona com bases de código existentes e com os assistentes de IA que você já usa."
    cta: "Conhecer o OpenSpec"
    alt: "OpenSpec banner: agree on the spec, then build with AI"
  subsite-omniroute:
    title: "OmniRoute Docs: um endpoint para muitos provedores de IA"
    description: "Veja como o OmniRoute roteia muitos provedores e modelos de IA por um único endpoint, com suporte a planos gratuitos e fallback automático para que suas ferramentas de programação continuem funcionando."
    cta: "Ler a documentação do OmniRoute"
    alt: "OmniRoute Docs banner: one endpoint for many AI providers"
