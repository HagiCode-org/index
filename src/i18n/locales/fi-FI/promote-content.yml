promotions:
  desktop-microsoft-store-2026-06-10:
    title: "HagiCode Windowsille on nyt Microsoft Storessa"
    description: "HagiCode Windowsille on virallisesti saatavilla Microsoft Storessa. Windows-käyttäjät voivat asentaa sen suoraan kaupasta ja pysyä kaupan hallinnoimalla päivityspolulla. Avaa sivu ja käy katsomassa."
    cta: "Avaa Microsoft Store"
    alt: "HagiCode for Windows Microsoft Store artwork"
  main-game-2026-04-29:
    title: "Lisää toivelistallesi, ole hyvä"
    description: "Hagicode, maailmanlaajuisesti ei-uniikki mutta super kätevä Vibe Coding -ohjelmisto, julkaistaan 29. huhtikuuta. Lisää se ole hyvä Steam-toivelistallesi. Hytky. Ole hyvä, ole hyvä."
    cta: "Toivelista Steamissa"
    alt: "HagiCode Steam store capsule artwork"
  main-game-steam-ea-2026-04-29:
    title: "Early Access on viimein täällä"
    description: "Hagicode, maailmanlaajuisesti ei-uniikki mutta super kätevä Vibe Coding -ohjelmisto, on nyt Steam Early Accessissa. Tule katsomaan. Hytky. Ole hyvä, ole hyvä."
    cta: "Katso Early Access"
    alt: "HagiCode Early Access Steam artwork"
  hagicode-plus-bundle:
    title: "Hagicode Plus -paketti"
    description: "Hagicode Plus, maailmanlaajuisesti ei-uniikki mutta todella siististi paketoitu vaihtoehto, on 15 % alennuksessa yhdessä peruspelin ja Turbo Engine -DLC:n kanssa. Tule katsomaan Steamissa. Hytky. Ole hyvä, ole hyvä."
    cta: "Katso paketti"
    alt: "HagiCode Plus Steam bundle artwork"
  hagicode-turbo-engine-dlc:
    title: "Turbo Engine -DLC"
    description: "Turbo Engine -DLC ei ole maailmanlaajuisesti uniikki, mutta se todella toimii: avaa jopa 32 yhtäaikaista online-istuntoa ja lisää mukautusvaihtoehtoja Hagicode-työnkulkuusi. Tule katsomaan Steamissa. Hytky. Ole hyvä, ole hyvä."
    cta: "Katso DLC"
    alt: "Turbo Engine DLC Steam artwork"
  subsite-awesome:
    title: "Awesome Site: kuratoidut avoimen lähdekoodin kokoelmat"
    description: "Löydä seuraava työkalusi, ideasi tai inspiraatiosi yhteisön kuratoimista avoimen lähdekoodin kokoelmista. Valitse aihe, lue omalla kielelläsi ja seuraa linkkiä takaisin alkuperäiseen lähteeseen."
    cta: "Tutustu Awesome Siteen"
    alt: "Awesome Site banner: community-curated open-source collections"
  subsite-design:
    title: "Awesome Design: DESIGN.md-galleria"
    description: "Selaa kuratoituja suunnittelujärjestelmiä live-esikatseluiden ja README-viitteiden avulla, kopioi sitten DESIGN.md projektiisi ja anna tekoälyagenttisi rakentaa sivu, joka vastaa sitä."
    cta: "Selaa suunnittelugalleriaa"
    alt: "Awesome Design banner: a gallery of DESIGN.md design systems"
  subsite-openspec:
    title: "OpenSpec: sovi suunnitelmasta ennen kuin tekoäly kirjoittaa koodia"
    description: "OpenSpec on kevyt määrittelykerros tekoälyavusteiseen koodaukseen. Kuvaa muutos, tarkista tekoälysi laatima ehdotus, määrittelyt, suunnitelma ja tehtävät, toteuta muutos ja arkistoi se elävään määrittelyyn. Ei jäykkiä vaiheita, ja se sopii olemassa oleviin koodikantoihin ja jo käyttämiisi tekoälyavustajiin."
    cta: "Tutustu OpenSpeciin"
    alt: "OpenSpec banner: agree on the spec, then build with AI"
  subsite-omniroute:
    title: "OmniRoute Docs: yksi päätepiste monille tekoälypalveluntarjoajille"
    description: "Opi, miten OmniRoute reitittää monia tekoälypalveluntarjoajia ja malleja yhden päätepisteen kautta, ilmaisten tasojen tuella ja automaattisella varavaihtoehdolla, jotta koodaustyökalusi pysyvät toiminnassa."
    cta: "Lue OmniRoute-dokumentaatio"
    alt: "OmniRoute Docs banner: one endpoint for many AI providers"
