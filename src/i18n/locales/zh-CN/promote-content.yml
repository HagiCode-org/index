promotions:
  desktop-microsoft-store-2026-06-10:
    title: "HagiCode for Windows 已上线 Microsoft Store"
    description: "HagiCode for Windows 现已正式登陆 Microsoft Store，Windows 用户可以直接从商店完成安装并接收渠道更新。现在就打开商店页看看吧。"
    cta: "打开 Microsoft Store"
    alt: "HagiCode for Windows Microsoft Store 宣传图"
  subsite-awesome:
    title: "Awesome Site：社区精选开源合集"
    description: "在开源社区精心整理的合集中，找到下一个工具、想法或灵感。从感兴趣的主题出发，用熟悉的语言阅读，再回到原始来源深入探索。"
    cta: "探索精选合集"
    alt: "Awesome Site 横幅：社区精选开源合集"
  subsite-design:
    title: "Awesome Design：DESIGN.md 设计系统画廊"
    description: "通过实时预览与 README 参考浏览精选设计系统，再把 DESIGN.md 复制进你的项目，让 AI 代理按它构建风格一致的页面。"
    cta: "浏览设计画廊"
    alt: "Awesome Design 横幅：DESIGN.md 设计系统画廊"
  subsite-openspec:
    title: "OpenSpec：先对齐规范，再让 AI 写代码"
    description: "OpenSpec 是面向 AI 编程的轻量规范层：先描述一项变更，由 AI 起草提案、规范、设计与任务，你审阅确认后再动手实现，完成后归档为持续更新的规范。没有僵化的阶段门槛，适用于已有代码库，并能搭配你正在使用的各类 AI 助手。"
    cta: "了解 OpenSpec"
    alt: "OpenSpec 横幅：先对齐规范，再用 AI 构建"
  subsite-omniroute:
    title: "OmniRoute 文档：一个端点连接众多 AI 服务商"
    description: "了解 OmniRoute 如何通过同一个端点路由众多 AI 服务商与模型，并支持免费额度与自动回退，让你的编码工具持续可用。"
    cta: "查看 OmniRoute 文档"
    alt: "OmniRoute 文档横幅：一个端点连接众多 AI 服务商"
