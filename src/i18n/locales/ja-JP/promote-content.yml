  main-game-steam-ea-2026-04-29:
    title: "Early Access ついに登場"
    description: "Hagicode は、世界で一意ではないけれど超便利な Vibe Coding ソフトで、Steam の Early Access に登場しました。ぜひ覗きに来てください。えんえん。お願い、お願い。"
    cta: "Early Access を見る"
    alt: "HagiCode Early Access Steam artwork"
  hagicode-plus-bundle:
    title: "Hagicode Plus バンドル"
    description: "Hagicode Plus は、世界で一意ではないけれど見事にまとめられたオプションで、本体と Turbo Engine DLC とのセットが 15% オフです。Steam でぜひご覧ください。えんえん。お願い、お願い。"
    cta: "バンドルを見る"
    alt: "HagiCode Plus Steam bundle artwork"
  hagicode-turbo-engine-dlc:
    title: "Turbo Engine DLC"
    description: "Turbo Engine DLC は世界で一意ではありませんが、本当に動きます。Hagicode のワークフロー向けに、最大 32 の同時オンラインセッションとさらに多くのカスタマイズオプションを解放します。Steam で覗いてみてください。えんえん。お願い、お願い。"
    cta: "DLC を見る"
    alt: "Turbo Engine DLC Steam artwork"
  subsite-awesome:
    title: "Awesome Site：コミュニティが厳選したオープンソースのコレクション"
    description: "コミュニティが厳選したオープンソースのコレクションから、次のツールやアイデア、ひらめきを見つけましょう。トピックを選び、慣れた言語で読み、リンクをたどって元の情報源へ。"
    cta: "Awesome Site を探索"
    alt: "Awesome Site banner: community-curated open-source collections"
  subsite-design:
    title: "Awesome Design：DESIGN.md デザインシステムギャラリー"
    description: "ライブプレビューと README の参照を通じて厳選されたデザインシステムを閲覧し、DESIGN.md をプロジェクトにコピーして、AI エージェントに合ったページを作らせましょう。"
    cta: "デザインギャラリーを見る"
    alt: "Awesome Design banner: a gallery of DESIGN.md design systems"
  subsite-openspec:
    title: "OpenSpec：AI がコードを書く前に、計画をすり合わせる"
    description: "OpenSpec は、AI コーディングのための軽量なスペック層です。変更内容を伝えると、AI が提案、スペック、設計、タスクを下書きします。内容を確認してから実装し、完了後は生きたスペックとしてアーカイブ。硬直したフェーズはなく、既存のコードベースや普段使っている AI アシスタントにもそのまま使えます。"
    cta: "OpenSpec を知る"
    alt: "OpenSpec banner: agree on the spec, then build with AI"
  subsite-omniroute:
    title: "OmniRoute ドキュメント：ひとつのエンドポイントで多数の AI プロバイダーへ"
    description: "OmniRoute が、多数の AI プロバイダーとモデルをひとつのエンドポイントでルーティングし、無料枠への対応と自動フォールバックでコーディングツールを止めない仕組みを学びましょう。"
    cta: "OmniRoute ドキュメントを読む"
    alt: "OmniRoute Docs banner: one endpoint for many AI providers"
