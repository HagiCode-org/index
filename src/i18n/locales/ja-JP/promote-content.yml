    description: "HagiCode for Windows が Microsoft Store で正式に利用可能になりました。Windows ユーザーはストアから直接インストールでき、ストア管理のアップデート手段を利用できます。ページを開いてご覧ください。"
    cta: "Microsoft Store を開く"
    alt: "HagiCode for Windows Microsoft Store artwork"
  main-game-2026-04-29:
    title: "ウィッシュリストに追加してください、お願い"
    description: "Hagicode は、世界で一意ではないけれど超便利な Vibe Coding ソフトで、4月29日に発売します。Steam ウィッシュリストに追加してください。えんえん。お願い、お願い。"
