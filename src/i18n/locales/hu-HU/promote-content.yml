promotions:
  desktop-microsoft-store-2026-06-10:
    title: "A HagiCode Windowsra most elérhető a Microsoft Store-ban"
    description: "A HagiCode Windowsra hivatalosan elérhető a Microsoft Store-ban. A Windows-felhasználók közvetlenül a boltból telepíthetik, és a bolt által kezelt frissítési úton maradhatnak. Nyisd meg a lapot, és nézd meg."
    cta: "Microsoft Store megnyitása"
    alt: "HagiCode for Windows Microsoft Store artwork"
  subsite-awesome:
    title: "Awesome Site: válogatott nyílt forráskódú gyűjtemények"
    description: "Találd meg a következő eszközödet, ötletedet vagy inspirációdat a közösség által válogatott nyílt forráskódú gyűjteményekben. Válassz egy témát, olvass a saját nyelvedén, és kövesd a linket az eredeti forráshoz."
    cta: "Fedezd fel az Awesome Site-ot"
    alt: "Awesome Site banner: community-curated open-source collections"
  subsite-design:
    title: "Awesome Design: DESIGN.md galéria"
    description: "Böngéssz válogatott designrendszerek között élő előnézetekkel és README-hivatkozásokkal, majd másolj egy DESIGN.md fájlt a projektedbe, és hagyd, hogy az AI-ügynököd illeszkedő oldalt építsen."
    cta: "Böngéssz a designgalériában"
    alt: "Awesome Design banner: a gallery of DESIGN.md design systems"
  subsite-openspec:
    title: "OpenSpec: egyeztess a tervről, mielőtt az AI kódot ír"
    description: "Az OpenSpec egy könnyű specifikációs réteg az AI-alapú programozáshoz. Írj le egy változtatást, nézd át az AI által készített javaslatot, specifikációkat, tervet és feladatokat, majd valósítsd meg, és archiváld élő specifikációkként. Nincsenek merev fázisok, és illeszkedik a meglévő kódbázisokhoz és a már használt AI-asszisztensekhez."
    cta: "Ismerd meg az OpenSpecet"
    alt: "OpenSpec banner: agree on the spec, then build with AI"
  subsite-omniroute:
    title: "OmniRoute Docs: egyetlen végpont sok AI-szolgáltatóhoz"
    description: "Tudd meg, hogyan irányítja az OmniRoute sok AI-szolgáltató és modell forgalmát egyetlen végponton keresztül, ingyenes csomagok támogatásával és automatikus tartalékváltással, hogy a kódolóeszközeid tovább működjenek."
    cta: "Olvasd az OmniRoute dokumentációját"
    alt: "OmniRoute Docs banner: one endpoint for many AI providers"
