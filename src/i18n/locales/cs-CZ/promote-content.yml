promotions:
  desktop-microsoft-store-2026-06-10:
    title: "HagiCode pro Windows je nyní v Microsoft Store"
    description: "HagiCode pro Windows je oficiálně dostupný v Microsoft Store. Uživatelé Windows jej mohou nainstalovat přímo z obchodu a zůstat na cestě aktualizací spravované obchodem. Otevřete stránku a podívejte se."
    cta: "Otevřít Microsoft Store"
    alt: "HagiCode for Windows Microsoft Store artwork"
  subsite-awesome:
    title: "Awesome Site: kurátorované open-source kolekce"
    description: "Najděte svůj další nástroj, nápad nebo inspiraci v open-source kolekcích vybraných komunitou. Vyberte si téma, čtěte ve svém jazyce a následujte odkaz zpět k původnímu zdroji."
    cta: "Prozkoumat Awesome Site"
    alt: "Awesome Site banner: community-curated open-source collections"
  subsite-design:
    title: "Awesome Design: galerie DESIGN.md"
    description: "Procházejte kurátorované designové systémy v živých náhledech a odkazech na README, pak zkopírujte DESIGN.md do svého projektu a nechte svého AI agenta vytvořit odpovídající stránku."
    cta: "Procházet galerii designů"
    alt: "Awesome Design banner: a gallery of DESIGN.md design systems"
  subsite-openspec:
    title: "OpenSpec: dohodněte plán, než AI napíše kód"
    description: "OpenSpec je odlehčená vrstva specifikací pro programování s AI. Popište změnu, zkontrolujte návrh, specifikace, design a úkoly, které AI připraví, pak ji implementujte a archivujte do živých specifikací. Bez pevných fází, vhodné pro existující kódové báze i AI asistenty, které už používáte."
    cta: "Prozkoumat OpenSpec"
    alt: "OpenSpec banner: agree on the spec, then build with AI"
  subsite-omniroute:
    title: "OmniRoute Docs: jeden koncový bod pro mnoho AI poskytovatelů"
    description: "Zjistěte, jak OmniRoute směruje mnoho AI poskytovatelů a modelů přes jediný koncový bod, s podporou bezplatných tarifů a automatickým přepnutím, aby vaše programovací nástroje fungovaly dál."
    cta: "Číst dokumentaci OmniRoute"
    alt: "OmniRoute Docs banner: one endpoint for many AI providers"
