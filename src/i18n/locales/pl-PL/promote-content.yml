promotions:
  desktop-microsoft-store-2026-06-10:
    title: "HagiCode dla Windows jest teraz w Microsoft Store"
    description: "HagiCode dla Windows jest oficjalnie dostępny w Microsoft Store. Użytkownicy Windows mogą zainstalować go bezpośrednio ze sklepu i pozostać na zarządzanej przez sklep ścieżce aktualizacji. Otwórz stronę i rzuć okiem."
    cta: "Otwórz Microsoft Store"
    alt: "HagiCode for Windows Microsoft Store artwork"
  subsite-awesome:
    title: "Awesome Site: wyselekcjonowane kolekcje open source"
    description: "Znajdź swoje następne narzędzie, pomysł lub inspirację w kolekcjach open source wyselekcjonowanych przez społeczność. Wybierz temat, czytaj w swoim języku i przejdź pod linkiem do oryginalnego źródła."
    cta: "Poznaj Awesome Site"
    alt: "Awesome Site banner: community-curated open-source collections"
  subsite-design:
    title: "Awesome Design: galeria DESIGN.md"
    description: "Przeglądaj wyselekcjonowane systemy projektowe dzięki podglądom na żywo i odnośnikom do README, a potem skopiuj DESIGN.md do swojego projektu i pozwól agentowi AI zbudować pasującą stronę."
    cta: "Przeglądaj galerię projektów"
    alt: "Awesome Design banner: a gallery of DESIGN.md design systems"
  subsite-openspec:
    title: "OpenSpec: uzgodnij plan, zanim AI napisze kod"
    description: "OpenSpec to lekka warstwa specyfikacji dla programowania z AI. Opisz zmianę, przejrzyj propozycję, specyfikacje, projekt i zadania przygotowane przez AI, a potem zaimplementuj ją i zarchiwizuj jako żywe specyfikacje. Bez sztywnych etapów, pasuje do istniejących baz kodu i asystentów AI, z których już korzystasz."
    cta: "Poznaj OpenSpec"
    alt: "OpenSpec banner: agree on the spec, then build with AI"
  subsite-omniroute:
    title: "OmniRoute Docs: jeden punkt końcowy dla wielu dostawców AI"
    description: "Dowiedz się, jak OmniRoute kieruje ruch do wielu dostawców i modeli AI przez jeden punkt końcowy, z obsługą darmowych planów i automatycznym przełączaniem awaryjnym, aby Twoje narzędzia do kodowania działały bez przerw."
    cta: "Czytaj dokumentację OmniRoute"
    alt: "OmniRoute Docs banner: one endpoint for many AI providers"
