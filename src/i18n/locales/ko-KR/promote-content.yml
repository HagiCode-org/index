promotions:
  desktop-microsoft-store-2026-06-10:
    title: "HagiCode for Windows가 이제 Microsoft Store에 등록되었습니다"
    description: "HagiCode for Windows가 Microsoft Store에서 정식으로 이용 가능합니다. Windows 사용자는 스토어에서 바로 설치할 수 있고 스토어가 관리하는 업데이트 경로를 이용할 수 있습니다. 페이지를 열어 확인해 보세요."
    cta: "Microsoft Store 열기"
    alt: "Microsoft Store의 HagiCode for Windows 아트워크"
  subsite-awesome:
    title: "Awesome Site: 엄선된 오픈소스 컬렉션"
    description: "커뮤니티가 엄선한 오픈소스 컬렉션에서 다음 도구, 아이디어, 영감을 찾아보세요. 주제를 고르고, 익숙한 언어로 읽고, 링크를 따라 원본 출처로 이동해 보세요."
    cta: "Awesome Site 둘러보기"
    alt: "Awesome Site 배너: 커뮤니티가 엄선한 오픈소스 컬렉션"
  subsite-design:
    title: "Awesome Design: DESIGN.md 갤러리"
    description: "라이브 미리보기와 README 참고 자료로 엄선된 디자인 시스템을 둘러보고, DESIGN.md를 프로젝트에 복사한 뒤 AI 에이전트가 어울리는 페이지를 만들도록 해 보세요."
    cta: "디자인 갤러리 둘러보기"
    alt: "Awesome Design 배너: DESIGN.md 디자인 시스템 갤러리"
  subsite-openspec:
    title: "OpenSpec: AI가 코드를 쓰기 전에 계획부터 합의하세요"
    description: "OpenSpec은 AI 코딩을 위한 가벼운 스펙 계층입니다. 변경 사항을 설명하면 AI가 제안, 스펙, 설계, 작업을 초안으로 작성하고, 검토를 거쳐 구현한 뒤 살아 있는 스펙으로 보관합니다. 경직된 단계 없이 기존 코드베이스와 이미 쓰고 있는 AI 어시스턴트에 그대로 적용할 수 있습니다."
    cta: "OpenSpec 알아보기"
    alt: "OpenSpec 배너: 스펙에 먼저 합의한 뒤 AI로 구현"
  subsite-omniroute:
    title: "OmniRoute Docs: 하나의 엔드포인트로 여러 AI 제공업체를"
    description: "OmniRoute가 여러 AI 제공업체와 모델을 하나의 엔드포인트로 라우팅하고, 무료 요금제 지원과 자동 폴백으로 코딩 도구가 계속 동작하게 하는 방법을 알아보세요."
    cta: "OmniRoute 문서 읽기"
    alt: "OmniRoute Docs 배너: 하나의 엔드포인트로 여러 AI 제공업체를"
