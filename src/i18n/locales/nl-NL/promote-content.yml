promotions:
  desktop-microsoft-store-2026-06-10:
    title: "HagiCode voor Windows is nu in de Microsoft Store"
    description: "HagiCode voor Windows is officieel beschikbaar in de Microsoft Store. Windows-gebruikers kunnen het direct vanuit de winkel installeren en op het door de winkel beheerde update-pad blijven. Open de pagina en neem een kijkje."
    cta: "Open Microsoft Store"
    alt: "HagiCode for Windows Microsoft Store artwork"
  main-game-2026-04-29:
    title: "Zet hem op je verlanglijst, alsjeblieft"
    description: "Hagicode, de niet wereldwijd unieke maar super handige Vibe Coding-software, verschijnt op 29 april. Voeg hem alsjeblieft toe aan je Steam-verlanglijst. Snik. Alsjeblieft, alsjeblieft."
    cta: "Op verlanglijst in Steam"
    alt: "HagiCode Steam store capsule artwork"
  main-game-steam-ea-2026-04-29:
    title: "Early Access is eindelijk hier"
    description: "Hagicode, de niet wereldwijd unieke maar super handige Vibe Coding-software, is nu in Steam Early Access. Kom even kijken. Snik. Alsjeblieft, alsjeblieft."
    cta: "Bekijk Early Access"
    alt: "HagiCode Early Access Steam artwork"
  hagicode-plus-bundle:
    title: "Hagicode Plus-bundel"
    description: "Hagicode Plus, de niet wereldwijd unieke maar echt mooi gebundelde optie, is 15% goedkoper samen met het basisspel en de Turbo Engine DLC. Kom kijken op Steam. Snik. Alsjeblieft, alsjeblieft."
    cta: "Bekijk bundel"
    alt: "HagiCode Plus Steam bundle artwork"
  hagicode-turbo-engine-dlc:
    title: "Turbo Engine DLC"
    description: "De Turbo Engine DLC is niet wereldwijd uniek, maar hij loopt echt: ontgrendel tot 32 gelijktijdige online sessies en meer aanpassingsopties voor je Hagicode-workflow. Kom even kijken op Steam. Snik. Alsjeblieft, alsjeblieft."
    cta: "Bekijk DLC"
    alt: "Turbo Engine DLC Steam artwork"
  subsite-awesome:
    title: "Awesome Site: samengestelde open-sourcecollecties"
    description: "Vind je volgende tool, idee of inspiratiebron in open-sourcecollecties die door de community zijn samengesteld. Kies een onderwerp, lees in je eigen taal en volg de link terug naar de oorspronkelijke bron."
    cta: "Awesome Site verkennen"
    alt: "Awesome Site banner: community-curated open-source collections"
  subsite-design:
    title: "Awesome Design: een DESIGN.md-galerij"
    description: "Blader door samengestelde designsystemen met live previews en README-verwijzingen, kopieer daarna een DESIGN.md naar je project en laat je AI-agent een bijpassende pagina bouwen."
    cta: "Bekijk de designgalerij"
    alt: "Awesome Design banner: a gallery of DESIGN.md design systems"
  subsite-openspec:
    title: "OpenSpec: spreek het plan af voordat je AI code schrijft"
    description: "OpenSpec is een lichte specificatielaag voor programmeren met AI. Beschrijf een wijziging, beoordeel het voorstel, de specificaties, het ontwerp en de taken die je AI opstelt, bouw het daarna en archiveer het in levende specificaties. Geen starre fasen, en het past bij bestaande codebases en de AI-assistenten die je al gebruikt."
    cta: "Ontdek OpenSpec"
    alt: "OpenSpec banner: agree on the spec, then build with AI"
  subsite-omniroute:
    title: "OmniRoute Docs: één endpoint voor veel AI-providers"
    description: "Ontdek hoe OmniRoute veel AI-providers en modellen via één enkel endpoint routeert, met ondersteuning voor gratis tiers en automatische fallback, zodat je codeertools blijven werken."
    cta: "Lees de OmniRoute-documentatie"
    alt: "OmniRoute Docs banner: one endpoint for many AI providers"
