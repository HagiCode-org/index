promotions:
  desktop-microsoft-store-2026-06-10:
    title: "HagiCode untuk Windows kini ada di Microsoft Store"
    description: "HagiCode untuk Windows kini resmi tersedia di Microsoft Store. Pengguna Windows dapat menginstalnya langsung dari toko dan tetap berada di jalur pembaruan yang dikelola toko. Buka halaman dan lihat."
    cta: "Buka Microsoft Store"
    alt: "HagiCode for Windows Microsoft Store artwork"
  main-game-2026-04-29:
    title: "Tolong tambahkan ke daftar keinginan"
    description: "Hagicode, perangkat lunak Vibe Coding yang tidak unik di seluruh dunia tetapi sangat praktis, meluncur pada 29 April. Tolong tambahkan ke daftar keinginan Steam Anda. Hik. Tolong, tolong."
    cta: "Tambah ke keinginan di Steam"
    alt: "HagiCode Steam store capsule artwork"
  main-game-steam-ea-2026-04-29:
    title: "Akses Awal akhirnya tiba"
    description: "Hagicode, perangkat lunak Vibe Coding yang tidak unik di seluruh dunia tetapi sangat praktis, kini ada di Steam Early Access. Mari datang melihatnya. Hik. Tolong, tolong."
    cta: "Lihat Akses Awal"
    alt: "HagiCode Early Access Steam artwork"
  hagicode-plus-bundle:
    title: "Paket Hagicode Plus"
    description: "Hagicode Plus, pilihan yang tidak unik di seluruh dunia tetapi benar-benar dikemas dengan apik, diskon 15% bersama game dasar dan DLC Turbo Engine. Mari cek di Steam. Hik. Tolong, tolong."
    cta: "Lihat paket"
    alt: "HagiCode Plus Steam bundle artwork"
  hagicode-turbo-engine-dlc:
    title: "DLC Turbo Engine"
    description: "DLC Turbo Engine tidak unik di seluruh dunia, tetapi benar-benar bisa berjalan: buka hingga 32 sesi online bersamaan dan lebih banyak opsi kustomisasi untuk alur kerja Hagicode Anda. Mari intip di Steam. Hik. Tolong, tolong."
    cta: "Lihat DLC"
    alt: "Turbo Engine DLC Steam artwork"
  subsite-awesome:
    title: "Awesome Site: koleksi sumber terbuka pilihan"
    description: "Temukan alat, ide, atau inspirasi berikutnya dalam koleksi sumber terbuka pilihan komunitas. Pilih topik, baca dalam bahasa Anda, dan ikuti tautan kembali ke sumber aslinya."
    cta: "Jelajahi Awesome Site"
    alt: "Awesome Site banner: community-curated open-source collections"
  subsite-design:
    title: "Awesome Design: galeri DESIGN.md"
    description: "Telusuri sistem desain pilihan melalui pratinjau langsung dan referensi README, lalu salin DESIGN.md ke proyek Anda dan biarkan agen AI Anda membangun halaman yang serasi."
    cta: "Telusuri galeri desain"
    alt: "Awesome Design banner: a gallery of DESIGN.md design systems"
  subsite-openspec:
    title: "OpenSpec: sepakati rencana sebelum AI menulis kode"
    description: "OpenSpec adalah lapisan spesifikasi ringan untuk pemrograman dengan AI. Jelaskan sebuah perubahan, tinjau proposal, spesifikasi, desain, dan tugas yang disusun AI Anda, lalu bangun dan arsipkan menjadi spesifikasi yang hidup. Tanpa fase yang kaku, dan cocok untuk basis kode yang sudah ada serta asisten AI yang sudah Anda gunakan."
    cta: "Kenali OpenSpec"
    alt: "OpenSpec banner: agree on the spec, then build with AI"
  subsite-omniroute:
    title: "OmniRoute Docs: satu endpoint untuk banyak penyedia AI"
    description: "Pelajari bagaimana OmniRoute merutekan banyak penyedia dan model AI melalui satu endpoint, dengan dukungan paket gratis dan fallback otomatis agar alat pemrograman Anda tetap berjalan."
    cta: "Baca dokumentasi OmniRoute"
    alt: "OmniRoute Docs banner: one endpoint for many AI providers"
