    title: "Комплект Hagicode Plus"
    description: "Hagicode Plus — не уникальная во всём мире, но очень удачно собранная опция — со скидкой 15% вместе с основной игрой и DLC Turbo Engine. Загляните в Steam. Хлюп. Пожалуйста, пожалуйста."
