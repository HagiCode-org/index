promotions:
  desktop-microsoft-store-2026-06-10:
    title: "HagiCode для Windows теперь в Microsoft Store"
    description: "HagiCode для Windows официально доступен в Microsoft Store. Пользователи Windows могут установить его прямо из магазина и оставаться на управляемом магазином пути обновлений. Откройте страницу и взгляните."
    cta: "Открыть Microsoft Store"
    alt: "Иллюстрация HagiCode для Windows в Microsoft Store"
  subsite-awesome:
    title: "Awesome Site: тщательно отобранные коллекции с открытым исходным кодом"
    description: "Найдите свой следующий инструмент, идею или источник вдохновения в коллекциях с открытым исходным кодом, которые отобрало сообщество. Выберите тему, читайте на своём языке и переходите по ссылке к первоисточнику."
    cta: "Изучить Awesome Site"
    alt: "Баннер Awesome Site: подборки open-source проектов от сообщества"
  subsite-design:
    title: "Awesome Design: галерея DESIGN.md"
    description: "Просматривайте отобранные дизайн-системы с живыми превью и ссылками на README, затем скопируйте DESIGN.md в свой проект и поручите ИИ-агенту создать подходящую страницу."
    cta: "Открыть галерею дизайна"
    alt: "Баннер Awesome Design: галерея дизайн-систем DESIGN.md"
  subsite-openspec:
    title: "OpenSpec: согласуйте план, прежде чем ИИ напишет код"
    description: "OpenSpec — лёгкий слой спецификаций для программирования с ИИ. Опишите изменение, изучите предложение, спецификации, дизайн и задачи, которые составит ваш ИИ, затем реализуйте его и заархивируйте в живые спецификации. Никаких жёстких этапов; подходит для существующих кодовых баз и ИИ-ассистентов, которыми вы уже пользуетесь."
    cta: "Узнать об OpenSpec"
    alt: "Баннер OpenSpec: сначала согласуйте спецификацию, затем стройте с ИИ"
  subsite-omniroute:
    title: "OmniRoute Docs: одна конечная точка для множества ИИ-провайдеров"
    description: "Узнайте, как OmniRoute маршрутизирует множество ИИ-провайдеров и моделей через одну конечную точку, с поддержкой бесплатных тарифов и автоматическим переключением на резерв, чтобы ваши инструменты для программирования продолжали работать."
    cta: "Читать документацию OmniRoute"
    alt: "Баннер OmniRoute Docs: одна конечная точка для множества ИИ-провайдеров"
