promotions:
  desktop-microsoft-store-2026-06-10:
    title: "HagiCode for Windows er nå i Microsoft Store"
    description: "HagiCode for Windows er offisielt tilgjengelig i Microsoft Store. Windows-brukere kan installere det direkte fra butikken og forbli på den butikkstyrte oppdateringsstien. Åpne siden og ta en titt."
    cta: "Åpne Microsoft Store"
    alt: "HagiCode for Windows Microsoft Store artwork"
  main-game-2026-04-29:
    title: "Legg den i ønskelisten, vær så snill"
    description: "Hagicode, Vibe Coding-programvaren som ikke er unik i hele verden, men super praktisk, lanseres 29. april. Legg den vær så snill i din Steam-ønskeliste. Hulk. Vær så snill, vær så snill."
    cta: "Ønskeliste på Steam"
    alt: "HagiCode Steam store capsule artwork"
  main-game-steam-ea-2026-04-29:
    title: "Early Access er endelig her"
    description: "Hagicode, Vibe Coding-programvaren som ikke er unik i hele verden, men super praktisk, er nå i Steam Early Access. Kom og ta en titt. Hulk. Vær så snill, vær så snill."
    cta: "Se Early Access"
    alt: "HagiCode Early Access Steam artwork"
  hagicode-plus-bundle:
    title: "Hagicode Plus-pakke"
    description: "Hagicode Plus, alternativet som ikke er unikt i hele verden, men virkelig fint pakket, gir 15 % rabatt sammen med hovedspillet og Turbo Engine-DLC-en. Kom og ta en titt på Steam. Hulk. Vær så snill, vær så snill."
    cta: "Se pakken"
    alt: "HagiCode Plus Steam bundle artwork"
  hagicode-turbo-engine-dlc:
    title: "Turbo Engine-DLC"
    description: "Turbo Engine-DLC-en er ikke unik i hele verden, men den kjører virkelig: lås opp opptil 32 samtidige onlinesesjoner og flere tilpassingsmuligheter for Hagicode-arbeidsflyten din. Kom og ta en titt på Steam. Hulk. Vær så snill, vær så snill."
    cta: "Se DLC"
    alt: "Turbo Engine DLC Steam artwork"
  subsite-awesome:
    title: "Awesome Site: kuraterte åpen kildekode-samlinger"
    description: "Finn ditt neste verktøy, din neste idé eller inspirasjon i åpen kildekode-samlinger kuratert av fellesskapet. Velg et emne, les på ditt eget språk og følg lenken tilbake til den opprinnelige kilden."
    cta: "Utforsk Awesome Site"
    alt: "Awesome Site banner: community-curated open-source collections"
  subsite-design:
    title: "Awesome Design: et DESIGN.md-galleri"
    description: "Bla gjennom kuraterte designsystemer via live-forhåndsvisninger og README-referanser, kopier deretter en DESIGN.md inn i prosjektet ditt og la AI-agenten din bygge en side som matcher."
    cta: "Bla gjennom designgalleriet"
    alt: "Awesome Design banner: a gallery of DESIGN.md design systems"
  subsite-openspec:
    title: "OpenSpec: bli enig om planen før AI-en skriver kode"
    description: "OpenSpec er et lett spesifikasjonslag for AI-koding. Beskriv en endring, gå gjennom forslaget, spesifikasjonene, designet og oppgavene AI-en utarbeider, bygg den deretter og arkiver den i levende spesifikasjoner. Ingen rigide faser, og det passer til eksisterende kodebaser og AI-assistentene du allerede bruker."
    cta: "Utforsk OpenSpec"
    alt: "OpenSpec banner: agree on the spec, then build with AI"
  subsite-omniroute:
    title: "OmniRoute Docs: ett endepunkt for mange AI-leverandører"
    description: "Lær hvordan OmniRoute ruter mange AI-leverandører og modeller gjennom ett enkelt endepunkt, med støtte for gratisnivåer og automatisk reserveløsning slik at kodeverktøyene dine fortsetter å fungere."
    cta: "Les OmniRoute-dokumentasjonen"
    alt: "OmniRoute Docs banner: one endpoint for many AI providers"
