promotions:
  desktop-microsoft-store-2026-06-10:
    title: "HagiCode para Windows já está na Microsoft Store"
    description: "HagiCode para Windows está oficialmente disponível na Microsoft Store. Os utilizadores do Windows podem instalá-lo diretamente a partir da loja e manter-se no percurso de atualizações gerido pela loja. Abra a página e dê uma vista de olhos."
    cta: "Abrir Microsoft Store"
    alt: "HagiCode for Windows Microsoft Store artwork"
  subsite-awesome:
    title: "Awesome Site: coleções de código aberto selecionadas"
    description: "Encontre a sua próxima ferramenta, ideia ou inspiração em coleções de código aberto selecionadas pela comunidade. Escolha um tema, leia no seu idioma e siga a ligação de volta à fonte original."
    cta: "Explorar o Awesome Site"
    alt: "Awesome Site banner: community-curated open-source collections"
  subsite-design:
    title: "Awesome Design: uma galeria de DESIGN.md"
    description: "Navegue por sistemas de design selecionados com pré-visualizações em direto e referências do README, depois copie um DESIGN.md para o seu projeto e deixe o seu agente de IA criar uma página que condiga."
    cta: "Navegar pela galeria de design"
    alt: "Awesome Design banner: a gallery of DESIGN.md design systems"
  subsite-openspec:
    title: "OpenSpec: alinhe o plano antes de a IA escrever código"
    description: "O OpenSpec é uma camada leve de especificações para programar com IA. Descreva uma alteração, reveja a proposta, as especificações, o design e as tarefas que a sua IA redige, depois implemente e arquive tudo em especificações vivas. Sem fases rígidas, e funciona com bases de código existentes e com os assistentes de IA que já utiliza."
    cta: "Conhecer o OpenSpec"
    alt: "OpenSpec banner: agree on the spec, then build with AI"
  subsite-omniroute:
    title: "OmniRoute Docs: um endpoint para muitos fornecedores de IA"
    description: "Saiba como o OmniRoute encaminha muitos fornecedores e modelos de IA através de um único endpoint, com suporte para planos gratuitos e alternativa automática para que as suas ferramentas de programação continuem a funcionar."
    cta: "Ler a documentação do OmniRoute"
    alt: "OmniRoute Docs banner: one endpoint for many AI providers"
