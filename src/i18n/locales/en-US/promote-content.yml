promotions:
  desktop-microsoft-store-2026-06-10:
    title: "HagiCode for Windows is now on Microsoft Store"
    description: "HagiCode for Windows is officially live on Microsoft Store. Windows users can install it directly from the storefront and stay on the store-managed update path. Open the listing and take a look."
    cta: "Open Microsoft Store"
    alt: "HagiCode for Windows Microsoft Store artwork"
  main-game-2026-04-29:
    title: "Wishlist It, Pretty Please"
    description: "Hagicode, the not-globally-unique but super handy Vibe Coding software, launches on April 29. Please add it to your Steam wishlist. Sob. Pretty please."
    cta: "Wishlist on Steam"
    alt: "HagiCode Steam store capsule artwork"
  main-game-steam-ea-2026-04-29:
    title: "Early Access Is Finally Here"
    description: "Hagicode, the not-globally-unique but super handy Vibe Coding software, is now in Steam Early Access. Please come take a look. Sob. Pretty please."
    cta: "View Early Access"
    alt: "HagiCode Early Access Steam artwork"
  hagicode-plus-bundle:
    title: "Hagicode Plus Bundle"
    description: "Hagicode Plus, the not-globally-unique but impressively bundled option, is 15% off with the base game and Turbo Engine DLC. Come check it out on Steam. Sob. Pretty please."
    cta: "View Bundle"
    alt: "Hagicode Plus Steam bundle artwork"
  hagicode-turbo-engine-dlc:
    title: "Turbo Engine DLC"
    description: "Turbo Engine DLC is not globally unique, but it really can run: unlock up to 32 concurrent online sessions and more customization options for your Hagicode workflow. Come peek on Steam. Sob. Pretty please."
    cta: "View DLC"
    alt: "Turbo Engine DLC Steam artwork"
  subsite-awesome:
    title: "Awesome Site: Curated Open-Source Collections"
    description: "Find your next tool, idea, or inspiration in community-curated open-source collections. Pick a topic, read in your language, and follow the link back to the original source."
    cta: "Explore Awesome Site"
    alt: "Awesome Site banner: community-curated open-source collections"
  subsite-design:
    title: "Awesome Design: A DESIGN.md Gallery"
    description: "Browse curated design systems through live previews and README references, then copy a DESIGN.md into your project and let your AI agent build a page that matches."
    cta: "Browse the Design Gallery"
    alt: "Awesome Design banner: a gallery of DESIGN.md design systems"
  subsite-openspec:
    title: "OpenSpec Docs: The Spec-Driven Workflow"
    description: "Read the OpenSpec documentation in ten languages and learn the spec-driven workflow that carries an idea from proposal through design and tasks to archive."
    cta: "Read the OpenSpec Docs"
    alt: "OpenSpec Docs banner: the spec-driven workflow documentation"
  subsite-omniroute:
    title: "OmniRoute Docs: One Endpoint for Many AI Providers"
    description: "Learn how OmniRoute routes many AI providers and models through a single endpoint, with free-tier support and automatic fallback so your coding tools keep working."
    cta: "Read the OmniRoute Docs"
    alt: "OmniRoute Docs banner: one endpoint for many AI providers"
