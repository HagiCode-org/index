promotions:
  desktop-microsoft-store-2026-06-10:
    title: "HagiCode för Windows finns nu i Microsoft Store"
    description: "HagiCode för Windows är officiellt tillgängligt i Microsoft Store. Windows-användare kan installera det direkt från butiken och stanna kvar på den butiksstyrda uppdateringsvägen. Öppna sidan och titta."
    cta: "Öppna Microsoft Store"
    alt: "HagiCode for Windows Microsoft Store artwork"
  main-game-2026-04-29:
    title: "Lägg till den i önskelistan, snälla"
    description: "Hagicode, Vibe Coding-mjukvaran som inte är unik i hela världen men superpraktisk, släpps den 29 april. Lägg till den i din Steam-önskelista, snälla. Snyft. Snälla, snälla."
    cta: "Önskelista på Steam"
    alt: "HagiCode Steam store capsule artwork"
  main-game-steam-ea-2026-04-29:
    title: "Early Access är äntligen här"
    description: "Hagicode, Vibe Coding-mjukvaran som inte är unik i hela världen men superpraktisk, finns nu i Steam Early Access. Kom och titta. Snyft. Snälla, snälla."
    cta: "Visa Early Access"
    alt: "HagiCode Early Access Steam artwork"
  hagicode-plus-bundle:
    title: "Hagicode Plus-paket"
    description: "Hagicode Plus, alternativet som inte är unikt i hela världen men verkligen snyggt paketerat, har 15 % rabatt tillsammans med basspelet och Turbo Engine-DLC:n. Kom och titta på Steam. Snyft. Snälla, snälla."
    cta: "Visa paket"
    alt: "HagiCode Plus Steam bundle artwork"
  hagicode-turbo-engine-dlc:
    title: "Turbo Engine-DLC"
    description: "Turbo Engine-DLC:n är inte unik i hela världen, men den kör verkligen: lås upp upp till 32 samtidiga onlinesessioner och fler anpassningsmöjligheter för ditt Hagicode-flöde. Kom och titta på Steam. Snyft. Snälla, snälla."
    cta: "Visa DLC"
    alt: "Turbo Engine DLC Steam artwork"
  subsite-awesome:
    title: "Awesome Site: kurerade open source-samlingar"
    description: "Hitta ditt nästa verktyg, din nästa idé eller inspiration i open source-samlingar som kurerats av communityn. Välj ett ämne, läs på ditt eget språk och följ länken tillbaka till den ursprungliga källan."
    cta: "Utforska Awesome Site"
    alt: "Awesome Site banner: community-curated open-source collections"
  subsite-design:
    title: "Awesome Design: ett DESIGN.md-galleri"
    description: "Bläddra bland kurerade designsystem med liveförhandsvisningar och README-referenser, kopiera sedan en DESIGN.md till ditt projekt och låt din AI-agent bygga en sida som matchar."
    cta: "Bläddra i designgalleriet"
    alt: "Awesome Design banner: a gallery of DESIGN.md design systems"
  subsite-openspec:
    title: "OpenSpec: bli överens om planen innan AI:n skriver kod"
    description: "OpenSpec är ett lätt specifikationslager för AI-kodning. Beskriv en ändring, granska förslaget, specifikationerna, designen och uppgifterna som din AI tar fram, bygg den sedan och arkivera den i levande specifikationer. Inga stela faser, och det passar befintliga kodbaser och de AI-assistenter du redan använder."
    cta: "Utforska OpenSpec"
    alt: "OpenSpec banner: agree on the spec, then build with AI"
  subsite-omniroute:
    title: "OmniRoute Docs: en endpoint för många AI-leverantörer"
    description: "Lär dig hur OmniRoute dirigerar många AI-leverantörer och modeller genom en enda endpoint, med stöd för gratisnivåer och automatisk reservväxling så att dina kodverktyg fortsätter fungera."
    cta: "Läs OmniRoute-dokumentationen"
    alt: "OmniRoute Docs banner: one endpoint for many AI providers"
