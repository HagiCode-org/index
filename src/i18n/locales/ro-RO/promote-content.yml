    alt: "HagiCode Steam store capsule artwork"
  main-game-steam-ea-2026-04-29:
    title: "Accesul Anticipat a sosit în sfârșit"
    description: "Hagicode, software-ul de Vibe Coding care nu este unic la nivel mondial, dar este super practic, este acum în Acces Anticipat pe Steam. Vino să arunci o privire. Hic. Te rugăm, te rugăm."
