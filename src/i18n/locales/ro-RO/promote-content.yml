    title: "HagiCode pentru Windows este acum în Microsoft Store"
    description: "HagiCode pentru Windows este oficial disponibil în Microsoft Store. Utilizatorii Windows îl pot instala direct din magazin și pot rămâne pe calea de actualizare gestionată de magazin. Deschide pagina și aruncă o privire."
    cta: "Deschide Microsoft Store"
    alt: "HagiCode for Windows Microsoft Store artwork"
  main-game-2026-04-29:
    title: "Te rugăm să îl adaugi la lista de dorințe"
    description: "Hagicode, software-ul de Vibe Coding care nu este unic la nivel mondial, dar este super practic, se lansează pe 29 aprilie. Te rugăm să îl adaugi la lista ta de dorințe de pe Steam. Hic. Te rugăm, te rugăm."
