    title: "HagiCode for Windows 已上架 Microsoft Store"
    description: "HagiCode for Windows 現已正式登陸 Microsoft Store，Windows 使用者可以直接從商店完成安裝並接收管道更新。現在就打開商店頁面看看吧。"
    cta: "打開 Microsoft Store"
    alt: "HagiCode for Windows Microsoft Store 宣傳圖"
  subsite-awesome:
    title: "Awesome Site：社群精選開源合集"
    description: "在開源社群精心整理的合集中，找到下一個工具、想法或靈感。從感興趣的主題出發，用熟悉的語言閱讀，再回到原始來源深入探索。"
    cta: "探索精選合集"
    alt: "Awesome Site 橫幅：社群精選開源合集"
  subsite-design:
    title: "Awesome Design：DESIGN.md 設計系統畫廊"
    description: "透過即時預覽與 README 參考瀏覽精選設計系統，再把 DESIGN.md 複製進你的專案，讓 AI 代理依它建構風格一致的頁面。"
    cta: "瀏覽設計畫廊"
    alt: "Awesome Design 橫幅：DESIGN.md 設計系統畫廊"
  subsite-openspec:
    title: "OpenSpec：先對齊規範，再讓 AI 寫程式碼"
    description: "OpenSpec 是面向 AI 程式開發的輕量規範層：先描述一項變更，由 AI 起草提案、規範、設計與任務，你審閱確認後再動手實作，完成後歸檔為持續更新的規範。沒有僵化的階段門檻，適用於既有程式碼庫，並能搭配你正在使用的各類 AI 助手。"
    cta: "了解 OpenSpec"
    alt: "OpenSpec 橫幅：先對齊規範，再用 AI 建構"
  subsite-omniroute:
    title: "OmniRoute 文件：一個端點連接眾多 AI 服務商"
    description: "了解 OmniRoute 如何透過同一個端點路由眾多 AI 服務商與模型，並支援免費額度與自動回退，讓你的編碼工具持續可用。"
    cta: "查看 OmniRoute 文件"
    alt: "OmniRoute 文件橫幅：一個端點連接眾多 AI 服務商"
